name: Build Cento & Co. (iOS IPA & Core Backend)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build & Verify Go Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cento-backend-go/go.sum

      - name: Build Core Server
        run: |
          cd cento-backend-go
          go vet ./...
          go build -v -o cento-server ./cmd/server

  build-ios:
    name: Build iOS IPA (Xcode Latest)
    needs: build-backend
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Selected: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cento-expo/package-lock.json

      - name: Set up Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Dependencies
        run: |
          cd cento-expo
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd cento-expo
          npx tsc --noEmit

      - name: Prebuild Native iOS Scaffolding
        run: |
          cd cento-expo
          npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd cento-expo/ios
          pod install --repo-update

      - name: Build iOS App with Xcode
        run: |
          cd cento-expo/ios
          xcodebuild clean archive \
            -workspace Cento.xcworkspace \
            -scheme Cento \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Cento.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload & Create IPA
        run: |
          mkdir -p build_output/Payload
          cp -r cento-expo/ios/build/Cento.xcarchive/Products/Applications/Cento.app build_output/Payload/
          cd build_output
          zip -qr Cento.ipa Payload
          zip -qr Cento-App.zip Payload/Cento.app
          cd ..

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cento-iOS-Release
          path: |
            build_output/*.ipa
            build_output/*.zip
          retention-days: 14

version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://cento:cento_secret_2026@postgres:5432/cento_db?sslmode=disable
      - TZ=America/Mexico_City
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cento
      - POSTGRES_PASSWORD=cento_secret_2026
      - POSTGRES_DB=cento_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cento -d cento_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
